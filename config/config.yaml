# Imported by the host application (config/packages/ps_summit_wishlist.yaml):
# imports:
#     - { resource: "@PsSummitSyliusWishlistPlugin/config/config.yaml" }
imports:
    - { resource: 'twig_hooks.yaml' }

sylius_resource:
    resources:
        ps_summit_wishlist.wishlist:
            classes:
                model: PsSummit\SyliusWishlistPlugin\Entity\Wishlist
                interface: PsSummit\SyliusWishlistPlugin\Entity\WishlistInterface
                repository: PsSummit\SyliusWishlistPlugin\Repository\WishlistRepository
        ps_summit_wishlist.wishlist_item:
            classes:
                model: PsSummit\SyliusWishlistPlugin\Entity\WishlistItem
                interface: PsSummit\SyliusWishlistPlugin\Entity\WishlistItemInterface
